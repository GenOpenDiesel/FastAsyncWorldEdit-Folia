name: Build Plugin

on:
  push:
    branches: [ feature/folia ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        run: ./gradlew build --no-daemon --stacktrace

      # Paper/Folia run with Mojang mappings -> use the "-Paper-" jar on Folia.
      - name: Upload Folia/Paper jar (Mojang-mapped, USE THIS ON FOLIA)
        uses: actions/upload-artifact@v4
        with:
          name: FastAsyncWorldEdit-Paper-Folia
          path: worldedit-bukkit/build/libs/FastAsyncWorldEdit-Paper-*.jar
          if-no-files-found: error

      # Spigot/CraftBukkit only - will NOT load on a Mojang-mapped Folia server.
      - name: Upload Spigot jar (reobf, NOT for Folia)
        uses: actions/upload-artifact@v4
        with:
          name: FastAsyncWorldEdit-Spigot
          path: worldedit-bukkit/build/libs/FastAsyncWorldEdit-Bukkit-*.jar
          if-no-files-found: error
